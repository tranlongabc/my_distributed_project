version: '3.8'

services:
  raspberry_pi_node_1:
    build: .
    container_name: raspberry_pi_node_1
    command: python /app/model_pipeline.py
    environment:
      - NODE_ROLE=node1
      - IP_NODE_2=raspberry_pi_node_2
      - IP_NODE_3=raspberry_pi_node_3
    volumes:
      - ./client_code:/app
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  raspberry_pi_node_2:
    build: .
    container_name: raspberry_pi_node_2
    command: python /app/model_pipeline.py
    environment:
      - NODE_ROLE=node2
      - IP_NODE_2=raspberry_pi_node_2
      - IP_NODE_3=raspberry_pi_node_3
    ports:
      - "5000:5000"
    volumes:
      - ./client_code:/app
      - ./data:/app/data
    depends_on:
      - raspberry_pi_node_1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  raspberry_pi_node_3:
    build: .
    container_name: raspberry_pi_node_3
    command: python /app/model_pipeline.py
    environment:
      - NODE_ROLE=node3
      - IP_NODE_2=raspberry_pi_node_2
      - IP_NODE_3=raspberry_pi_node_3
    ports:
      - "5001:5000"
    volumes:
      - ./client_code:/app
      - ./data:/app/data
    depends_on:
      - raspberry_pi_node_2
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G